services:
  relay:
    build: ..
    restart: unless-stopped
    environment:
      LATTICE_AUTH: github
      LATTICE_STORAGE_KEY: ${LATTICE_STORAGE_KEY:?Run the setup script first}
      LATTICE_GITHUB_ORG: ${LATTICE_GITHUB_ORG:-}
    volumes:
      - sessions:/data
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    pids_limit: 64
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      LATTICE_DOMAIN: ${LATTICE_DOMAIN:?Set your relay domain}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - proxy_config:/config
    depends_on:
      relay:
        condition: service_healthy
volumes:
  sessions:
  certificates:
  proxy_config:
